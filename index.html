<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alahamora – magiczna kawiarnia</title>
  <style>
    /* Natywne zagnieżdżanie CSS (CSS Nesting) – bez preprocesora */
    :root {
      --bg: #0F2621;
      --ink: #F4EDE2;
      --muted: #9FB3AA;
      --accent: #BFC6CC;
      --accent-light: #E4E9ED;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(70% 60% at 50% 40%, #173A31, var(--bg));
      color: var(--ink);
      font: 400 17px/1.6 Georgia, serif;
    }

    .hero {
      max-width: 40rem;
      padding: 3rem 2rem;
      text-align: center;

      & h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.2rem, 5vw, 3.4rem);
        letter-spacing: .02em;

        & em {
          color: var(--accent-light);
          font-style: italic;
        }
      }

      & p {
        margin: 0 0 2rem;
        color: var(--muted);
      }

      & .btn {
        display: inline-block;
        padding: .9rem 1.8rem;
        border: 1px solid var(--accent);
        border-radius: 999px;
        color: var(--accent-light);
        text-decoration: none;
        letter-spacing: .14em;
        text-transform: uppercase;
        font-size: .8rem;
        transition: background .3s, color .3s;

        &:hover,
        &:focus-visible {
          background: var(--accent-light);
          color: var(--bg);
        }
      }

      @media (max-width: 480px) {
        padding: 2rem 1.25rem;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <h1>Alahamora – <em>magiczna kawiarnia</em></h1>
    <p>Katowice · Gliwice. Strona w budowie – wkrótce więcej magii.</p>
    <a class="btn" href="#">Zarezerwuj stolik</a>
  </main>
</body>
</html>
