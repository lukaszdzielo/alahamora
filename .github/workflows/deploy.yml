# Automatyczne publikowanie na GitHub Pages po każdym pushu do main.
# Jednorazowo: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # gotowe rozmiary zdjęć (scripts/images.mjs) – przy kolejnych buildach robione są tylko zmienione
      - uses: actions/cache@v4
        with:
          path: public/_img
          key: img-${{ hashFiles('src/assets/img/**', 'scripts/images.mjs') }}
          restore-keys: img-
      - run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          # indeksowanie włączone także w podglądzie na GitHub Pages (decyzja Łukasza 25.11 – realne wyniki SEO)
          SITE_INDEX: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
